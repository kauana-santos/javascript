<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h2>Consulta de Endereço</h2>

        <section>
            <div>
                <label for="">CEP</label>
                <input type="text" placeholder="Ex: 01010-111" id="cep">
            </div>

            <div>
                <label for="">Rua / Logradouro</label>
                <input type="text" placeholder="Ex: Rua ..." id="rua">
            </div>

            <div>
                <label for="">Bairro</label>
                <input type="text" placeholder="Ex: Jardim Inglaterra" id="bairro">
            </div>
            <div>
                <label for="">Cidade</label>
                <input type="text" placeholder="Ex: São Paulo" id="cidade">
            </div>
            <div>
                <label for="">Estado (UF)</label>
                <input type="text" placeholder="Ex: São Paulo" id="estado">
            </div>
            <p id="mensagem"></p>

        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
